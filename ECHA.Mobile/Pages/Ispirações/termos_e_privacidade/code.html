<!DOCTYPE html>
<html lang="pt">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Termos & Privacidade – Economia com História</title>
  <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
  <link href="https://fonts.googleapis.com/css2?family=Public+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
  <script id="tailwind-config">
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            "surface": "#ffffff",
            "on-surface": "#1a1c1c",
            "brand-red": "#570013"
          },
          fontFamily: { body: ["Public Sans"] }
        }
      }
    }
  </script>
</head>
<body class="bg-surface text-on-surface font-body p-6">
  <h1 class="text-3xl font-bold mb-6">Termos de Uso</h1>
  <div class="space-y-4">
    <p>Ao aceder ao portal, concorda com estes termos. O conteúdo destina-se apenas a fins educativos.</p>
    <h2 class="font-bold text-lg text-brand-red">Privacidade</h2>
    <p>Coletamos apenas dados necessários para a sua conta académica. Não partilhamos dados com terceiros.</p>
  </div>
</body>
</html>
