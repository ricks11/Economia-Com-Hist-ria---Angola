<!DOCTYPE html>
<html lang="pt">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Arquivos – Economia com História</title>
  <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
  <link href="https://fonts.googleapis.com/css2?family=Public+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
  <script id="tailwind-config">
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            "primary": "#FFD700",
            "on-primary": "#000000",
            "brand-red": "#570013",
            "surface": "#ffffff",
            "on-surface": "#1a1c1c",
            "surface-container-low": "#f9f9f9"
          },
          fontFamily: { body: ["Public Sans"] }
        }
      }
    }
  </script>
</head>
<body class="bg-surface text-on-surface font-body p-6">
  <h1 class="text-3xl font-bold mb-6">Arquivos</h1>
  
  <div class="space-y-4">
    <div class="p-4 rounded-xl border border-stone-100 flex items-center gap-4">
      <div class="w-12 h-12 bg-surface-container-low rounded-lg flex items-center justify-center">📄</div>
      <div>
        <h3 class="font-bold">Plano de Fomento Agrário (1957)</h3>
        <p class="text-xs text-on-surface-variant">Relatório sobre investimentos.</p>
      </div>
    </div>
    <div class="p-4 rounded-xl border border-stone-100 flex items-center gap-4">
      <div class="w-12 h-12 bg-surface-container-low rounded-lg flex items-center justify-center">📷</div>
      <div>
        <h3 class="font-bold">Porto de Luanda (1972)</h3>
        <p class="text-xs text-on-surface-variant">Fotografia aérea histórica.</p>
      </div>
    </div>
  </div>
</body>
</html>
