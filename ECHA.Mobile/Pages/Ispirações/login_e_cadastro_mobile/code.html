        /* Base styles overrides for forms to match DS strictly */
        [type='text'], [type='email'], [type='password'] {
            border: none;

        [type='text']:focus, [type='email']:focus, [type='password']:focus {

        }

<style>

<body class="bg-surface text-on-surface font-body antialiased min-h-screen relative overflow-hidden">
<!-- Ambient Watermark Map Background -->
<div class="absolute inset-0 z-0 pointer-events-none opacity-20 mix-blend-multiply">
<img alt="" class="absolute -top-32 -left-32 w-[150%] max-w-none grayscale opacity-30 object-cover rotate-12" data-alt="Abstract subtle topographical lines resembling a minimalist map in light grey tones, premium editorial watermark texture" data-location="Angola" src="https://lh3.googleusercontent.com/aida-public/AB6AXuCQ1IJabRXZR--EVjBY7lupx0gFYEAgkGHItMoucLN7lPDnqznTnPBphTtQZLvervQ4A0dQBtFMY9IZlDkXoqr_HbLU7XVDEg89JGZ3rAzpIa42c4leheEWe2DY4g3DdntkMc2hf9udFKKz_2rsbfYe8awTjF0aozyc_hIUgk00hQMqJMoKfKfclIZQV7XBs3m-FvNd-CHKeFtJMkuh20vrCiBKeZXMChsHASVNjQxtzge2i8bkGY1ecgx6hEgUnemkt-cBcAazoztY"/>

<!-- Main Content Canvas (Mobile Optimized, Asymmetrical Layout) -->
<main class="relative z-10 w-full max-w-md mx-auto min-h-screen flex flex-col justify-center pl-6 pr-10 py-12">
<!-- Header Section -->
<header class="mb-10">
<div class="w-12 h-12 bg-surface-container-highest rounded-lg mb-6 flex items-center justify-center shadow-[0px_8px_32px_rgba(26,28,28,0.06)]">
<span class="material-symbols-outlined text-primary text-2xl" style="font-variation-settings: 'FILL' 1;">account_balance</span>
</div>
<h1 class="font-display font-extrabold text-4xl text-primary tracking-tighter leading-[1.1] mb-3">
                The Sovereign<br/>Archive
            </h1>
<p class="font-body text-lg text-on-surface-variant font-semibold leading-snug pr-4">
                O curador digital do património económico e histórico angolano.
            </p>
</header>
<!-- Glassmorphism Interactive Card -->
<div class="bg-surface-container-lowest/90 backdrop-blur-xl rounded-xl p-6 shadow-[0px_8px_32px_rgba(26,28,28,0.06)] ring-1 ring-outline-variant/15 flex flex-col gap-6 relative overflow-hidden">
<!-- Subtle gradient glow within card -->
<div class="absolute -top-10 -right-10 w-32 h-32 bg-primary/5 rounded-full blur-2xl pointer-events-none"></div>
<!-- Context Toggle -->
<div class="flex gap-6 border-b-2 border-surface-container pb-2">
<button class="font-headline font-bold text-lg text-primary border-b-2 border-primary -mb-[10px] pb-2 transition-colors">
                    Acesso
                </button>
<button class="font-headline font-bold text-lg text-on-surface-variant/40 hover:text-on-surface-variant transition-colors pb-2">
                    Registo
                </button>
</div>
<!-- Form Inputs -->
<div class="flex flex-col gap-4 mt-2">
<!-- Email Input -->
<div class="relative bg-surface-container-high rounded-t-lg pt-5 pb-2 px-4 group">
<label class="absolute top-2 left-4 font-label text-[10px] uppercase tracking-wider font-semibold text-on-surface-variant">
                        Correio Eletrónico
                    </label>
<input class="w-full bg-transparent font-body text-base text-on-surface p-0 placeholder-on-surface-variant/30" placeholder="nome@dominio.ao" type="email"/>
<!-- Animated Indicator Line -->
<div class="absolute bottom-0 left-0 w-full h-[2px] bg-primary scale-x-0 group-focus-within:scale-x-100 transition-transform duration-300 origin-left"></div>
</div>
<!-- Password Input -->
<div class="relative bg-surface-container-high rounded-t-lg pt-5 pb-2 px-4 group">
<label class="absolute top-2 left-4 font-label text-[10px] uppercase tracking-wider font-semibold text-on-surface-variant">

                    </label>
<input class="w-full bg-transparent font-body text-base text-on-surface p-0 placeholder-on-surface-variant/30 pr-10" placeholder="••••••••" type="password"/>
<button class="absolute right-3 top-1/2 -translate-y-1/2 text-on-surface-variant/50 hover:text-primary transition-colors focus:outline-none">
<span class="material-symbols-outlined text-[20px]">visibility_off</span>
</button>
<!-- Animated Indicator Line -->
<div class="absolute bottom-0 left-0 w-full h-[2px] bg-primary scale-x-0 group-focus-within:scale-x-100 transition-transform duration-300 origin-left"></div>
</div>
</div>

<button class="font-label text-sm text-primary font-semibold hover:text-primary-container transition-colors">

                </button>
</div>

<button class="w-full py-4 rounded-lg bg-gradient-to-br from-primary to-primary-container text-on-primary font-headline font-bold text-base tracking-wide flex justify-center items-center gap-2 hover:opacity-95 transition-opacity shadow-md">
                Entrar no Arquivo
                <span class="material-symbols-outlined text-sm">arrow_forward</span>
</button>
</div>
<!-- Secondary Journey (Guest Mode) -->
<div class="mt-10 flex flex-col items-center gap-6">
<!-- Ghost Divider -->
<div class="flex items-center w-full gap-4 px-4">
<div class="h-[1px] bg-outline-variant/20 flex-1"></div>
<span class="font-label text-[10px] uppercase tracking-widest text-on-surface-variant/60 font-semibold">Caminho Alternativo</span>
<div class="h-[1px] bg-outline-variant/20 flex-1"></div>
</div>
<!-- Secondary Button -->
<button class="w-full py-4 rounded-lg bg-surface-container-highest text-on-surface font-headline font-bold text-base tracking-wide flex justify-center items-center gap-3 shadow-[0px_4px_16px_rgba(26,28,28,0.03)] hover:bg-surface-container transition-colors ring-1 ring-outline-variant/10">
<span class="material-symbols-outlined text-[20px]" style="font-variation-settings: 'FILL' 1;">explore</span>

            </button>
