<!DOCTYPE html>

<html lang="pt"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Economia com História – Angola</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>

                    "on-secondary-container": "#656464",
                    "inverse-on-surface": "#f1f1f1",

<style>
        body {
            font-family: 'Public Sans', sans-serif;
            background-color: #f9f9f9;
        }
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
        .editorial-title {
            font-family: 'Manrope', sans-serif;
            letter-spacing: -0.02em;
        }
        .map-container {
            mask-image: linear-gradient(to bottom, black 80%, transparent 100%);
        }
    </style>
</head>
<body class="bg-surface text-on-surface overflow-hidden">
<!-- Splash Screen Wrapper -->
<main class="relative h-screen w-full flex flex-col items-center justify-center p-6 md:p-12 overflow-hidden">
<!-- Background Accents (Tonal Layering) -->
<div class="absolute inset-0 z-0">
<div class="absolute top-[-10%] right-[-5%] w-[60%] h-[60%] bg-surface-container-low rounded-full blur-[120px] opacity-60"></div>
<div class="absolute bottom-[-10%] left-[-5%] w-[50%] h-[50%] bg-tertiary-container/10 rounded-full blur-[100px] opacity-40"></div>
</div>
<!-- Content Canvas -->
<div class="relative z-10 w-full max-w-5xl flex flex-col items-center text-center">
<!-- Logo / Visual Anchor -->
<div class="mb-12 relative">
<!-- Stylized Angola Map Graphic -->
<div class="relative w-64 h-64 md:w-80 md:h-80 flex items-center justify-center">
<!-- Layered Abstract Map Silhouette -->
<svg class="absolute w-full h-full fill-primary-container/5 transform -rotate-6 scale-110" viewbox="0 0 200 240">
<path d="M60,10 L140,10 L160,60 L180,90 L160,140 L170,200 L120,230 L40,210 L10,160 L30,80 Z"></path>
</svg>
<div class="relative group">
<!-- Main Iconography -->
<div class="w-40 h-40 md:w-48 md:h-48 bg-surface-container-lowest rounded-[2rem] flex items-center justify-center shadow-[0_8px_24px_-4px_rgba(26,28,28,0.06)] border border-outline-variant/10">
<span class="material-symbols-outlined text-primary-container text-7xl md:text-8xl" data-icon="history_edu">history_edu</span>
</div>
<!-- Gold Accent Floating Badge -->
<div class="absolute -bottom-4 -right-4 w-16 h-16 bg-tertiary-container text-on-tertiary-container rounded-full flex items-center justify-center shadow-lg">
<span class="material-symbols-outlined text-2xl" data-icon="auto_stories">auto_stories</span>
</div>
</div>
</div>
</div>
<!-- Typography Hierarchy (Editorial Authority) -->
<div class="space-y-6 max-w-2xl">
<div class="inline-flex items-center gap-2 px-4 py-1.5 bg-tertiary-container/20 rounded-full mb-2">
<span class="w-2 h-2 rounded-full bg-tertiary-container"></span>
<span class="text-xs font-bold tracking-widest uppercase text-tertiary font-label">Portal Académico</span>
</div>
<h1 class="editorial-title text-5xl md:text-7xl font-extrabold text-primary leading-[1.1]">
                    Economia com História – Angola
                </h1>
<p class="text-lg md:text-xl text-on-secondary-container font-body leading-relaxed font-light">
                    Aprender, debater e transformar realidades através da preservação da narrativa económica nacional.
                </p>
</div>
<!-- CTA Section -->
<div class="mt-16 flex flex-col items-center gap-8">
<button class="group relative px-12 py-5 bg-primary-container text-on-primary rounded-full font-bold text-lg shadow-[0_20px_40px_-12px_rgba(77,7,11,0.3)] hover:-translate-y-1 transition-all duration-300 overflow-hidden">
<span class="relative z-10 flex items-center gap-3">
                        Entrar no Portal
                        <span class="material-symbols-outlined text-xl transition-transform group-hover:translate-x-1" data-icon="arrow_forward">arrow_forward</span>
</span>
<!-- Glass Shine Effect -->
<div class="absolute inset-0 bg-gradient-to-tr from-white/0 via-white/10 to-white/0 transform translate-x-[-100%] group-hover:translate-x-[100%] transition-transform duration-700"></div>
</button>
<!-- Quick Navigation Dots -->
<div class="flex gap-3">
<div class="w-8 h-1.5 rounded-full bg-primary-container"></div>
<div class="w-2 h-1.5 rounded-full bg-surface-container-highest"></div>
<div class="w-2 h-1.5 rounded-full bg-surface-container-highest"></div>
</div>
</div>
</div>
<!-- Decorative Footer Elements -->
<div class="absolute bottom-8 w-full px-12 flex justify-between items-end">
<div class="hidden md:block">
<p class="text-on-surface-variant/40 font-label text-xs uppercase tracking-[0.2em]">Luanda • Angola • 2024</p>
</div>
<div class="flex items-center gap-4 text-primary/60">
<span class="material-symbols-outlined" data-icon="account_balance">account_balance</span>
<div class="h-px w-8 bg-outline-variant/30"></div>
<span class="material-symbols-outlined" data-icon="public">public</span>
</div>
</div>
<!-- Corner Accents (Asymmetrical Layout) -->
<div class="absolute top-0 left-0 w-32 h-32 opacity-10 pointer-events-none">
<svg class="fill-primary-container" viewbox="0 0 100 100">
<rect height="60" width="2" x="10" y="10"></rect>
<rect height="2" width="60" x="10" y="10"></rect>
</svg>
</div>
</main>
<!-- Content Separation Tonal Layer -->
<div class="fixed bottom-0 left-0 w-full h-1 bg-gradient-to-r from-primary via-tertiary-container to-primary-container"></div>
